<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airport Investment Intelligence Agent</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="hbar">
      <div class="brand">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2c.8 0 1.3.7 1.3 1.6V9l7.7 4.5v2l-7.7-2.3v4.6l2.2 1.7V21L12 20l-3.5 1v-1.5l2.2-1.7v-4.6L3 15.5v-2L10.7 9V3.6C10.7 2.7 11.2 2 12 2z" transform="rotate(45 12 12)"/></svg></span>
        <div class="btext">
          <h1>Airport Investment Intelligence</h1>
          <p class="sub">Ranks US airports for terminal-expansion potential <span class="dot" aria-hidden="true">·</span> <span class="nowrap">deterministic scores, AI explains</span></p>
        </div>
      </div>
      <div class="actions">
        <label class="switch" id="speakWrap" hidden><input type="checkbox" role="switch" id="speak"><span class="slabel">Read aloud</span></label>
        <button type="button" id="newchat" class="ghost newchat"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>New chat</button>
      </div>
    </div>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <main id="log" aria-live="polite" aria-label="Conversation">
    <section id="welcome" class="welcome">
      <section class="method" id="method" aria-labelledby="methodTitle" hidden>
        <h2 id="methodTitle">How airports are scored</h2>
        <p class="method-lede" id="methodLede"></p>
        <div class="wbar" id="wbar" role="img"></div>
        <div class="wcols" id="wcols"></div>
        <dl class="method-facts" id="methodFacts"></dl>
      </section>
      <section class="examples" aria-labelledby="exTitle">
        <h2 id="exTitle">Try a question</h2>
        <div class="exlist" id="chips"></div>
        <p class="fine">Every answer lists the tools it used and states its assumptions. Figures that cannot be traced to tool output are flagged.</p>
      </section>
    </section>
  </main>

  <form id="form" autocomplete="off">
    <label for="input" class="sr">Your question</label>
    <textarea id="input" rows="1" maxlength="2000" placeholder="Ask a question, e.g. Compare LA and Santa Ana airport congestion levels" required></textarea>
    <button type="button" id="mic" class="ghost" aria-label="Speak your question" title="Speak your question" hidden>🎤</button>
    <button type="submit" id="send">Send</button>
  </form>

  <script type="module" src="/app.js"></script>
</body>
</html>
